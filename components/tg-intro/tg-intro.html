<!-- Component: tg-intro (What do you know? — category cards + search) -->
<section class="tg-intro" data-component="tg-intro">
  <div class="tg-intro__cats">
    <h2 class="tg-intro__title">What do you know?</h2>
    <ul class="tg-intro__cards">
      <li class="tg-cat">
        <div class="tg-cat__top">
          <p class="tg-cat__name">Attractions</p>
          <img src="assets/icons/tg-tour.svg" alt="" width="59" height="59">
        </div>
        <span class="tg-cat__arrow"><img src="assets/icons/tg-arrow.svg" alt="" width="33" height="29"></span>
      </li>
      <li class="tg-cat">
        <div class="tg-cat__top">
          <p class="tg-cat__name">Food &amp; Dining</p>
          <img src="assets/icons/tg-sushi.svg" alt="" width="57" height="57">
        </div>
        <span class="tg-cat__arrow"><img src="assets/icons/tg-arrow.svg" alt="" width="33" height="29"></span>
      </li>
      <li class="tg-cat">
        <div class="tg-cat__top">
          <p class="tg-cat__name">Suggested Itineraries</p>
          <img src="assets/icons/tg-route.svg" alt="" width="56" height="55">
        </div>
        <span class="tg-cat__arrow"><img src="assets/icons/tg-arrow.svg" alt="" width="33" height="29"></span>
      </li>
    </ul>
  </div>

  <form class="tg-search" role="search">
    <img class="tg-search__icon" src="assets/icons/tg-search.svg" alt="" width="16" height="16">
    <input class="tg-search__input" type="search" name="q" placeholder="キーワードで記事を検索（例: 書道、京都、伝統工芸...）" aria-label="Search articles">
    <button class="tg-search__btn" type="submit">検索</button>
  </form>
</section>
