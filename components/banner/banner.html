<!-- Component: banner (business/list/detail title block with breadcrumb) -->
<section class="biz-banner{{cls}}" data-component="banner">
  <div class="biz-banner__inner">
    <p class="biz-banner__crumbs"><a href="index.html#top">TOP</a> / {{crumb}}</p>
    <div class="biz-banner__head">
      <h1 class="biz-banner__title">{{title}}</h1>
      <p class="biz-banner__lead">{{lead}}</p>
    </div>
  </div>
</section>
