<!-- Component: purpose (Our Purpose) -->
<section class="biz-purpose" data-component="purpose">
  <div class="biz-purpose__inner">
    <header class="biz-head">
      <h2 class="biz-head__title">{{title}}</h2>
      <p class="biz-head__sub">{{sub}}</p>
    </header>

    <div class="biz-purpose__body">
      <div class="biz-purpose__lead">
        {{lead}}
      </div>
      <div class="biz-purpose__text">
        {{text}}
      </div>
    </div>
  </div>
</section>
