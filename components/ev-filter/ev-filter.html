<!-- Component: ev-filter (category checkboxes + search button, count heading) -->
<section class="ev-filter" data-component="ev-filter">
  <div class="ev-filter__inner">
    <form class="ev-filter__box">
      <div class="ev-filter__cats">
        <p class="ev-filter__label">Category</p>
        <div class="ev-filter__checks">
        <label class="ev-check"><input class="ev-check__box" type="checkbox" name="category" value="Japanese Culture"><span>Japanese Culture</span></label>
        <label class="ev-check"><input class="ev-check__box" type="checkbox" name="category" value="Travel"><span>Travel</span></label>
        <label class="ev-check"><input class="ev-check__box" type="checkbox" name="category" value="Hospitality"><span>Hospitality</span></label>
        <label class="ev-check"><input class="ev-check__box" type="checkbox" name="category" value="Local Tips"><span>Local Tips</span></label>
        <label class="ev-check"><input class="ev-check__box" type="checkbox" name="category" value="Dining"><span>Dining</span></label>
        </div>
      </div>
      <button class="ev-filter__btn" type="submit"><img src="assets/icons/ev-search.svg" alt="" width="11" height="11"><span>Search</span></button>
    </form>

    <p class="ev-filter__count">A total of 99 events.</p>
  </div>
</section>
